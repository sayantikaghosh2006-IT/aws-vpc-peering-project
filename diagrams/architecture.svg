<svg xmlns="http://www.w3.org/2000/svg" width="900" height="640" viewBox="0 0 900 640" font-family="Arial, Helvetica, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>EWB VPC Peering architecture (deployed)</title>
  <rect width="900" height="640" fill="#ffffff"/>
  <text x="450" y="28" text-anchor="middle" font-size="18" font-weight="bold" fill="#0b1530">EWB VPC Peering — deployed architecture</text>
  <text x="450" y="48" text-anchor="middle" font-size="12" fill="#555">Region: us-east-1 · Resource IDs: inventory/resource-inventory.md</text>

  <rect x="340" y="68" width="220" height="54" rx="8" fill="#f5f0e8" stroke="#999"/>
  <text x="450" y="91" text-anchor="middle" font-size="14" fill="#0b1530">Your laptop</text>
  <text x="450" y="110" text-anchor="middle" font-size="11" fill="#555">WSL · private key in ~/.ssh only</text>

  <line x1="450" y1="122" x2="450" y2="160" stroke="#0aa2e0" stroke-width="2.5" marker-end="url(#arr)"/>
  <text x="458" y="146" font-size="11" fill="#333">SSH / TCP 22 from your public IP /32</text>

  <rect x="350" y="162" width="200" height="46" rx="8" fill="#f5f0e8" stroke="#999"/>
  <text x="450" y="182" text-anchor="middle" font-size="14" fill="#0b1530">ewb-igw-a</text>
  <text x="450" y="199" text-anchor="middle" font-size="11" fill="#555">Attached to VPC A</text>

  <defs><marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#0aa2e0"/></marker></defs>

  <!-- VPC A -->
  <rect x="30" y="230" width="390" height="380" rx="12" fill="#eef6fb" stroke="#6aaed6" stroke-width="2"/>
  <text x="50" y="258" font-size="16" font-weight="bold" fill="#0b1530">ewb-vpc-a</text>
  <text x="50" y="276" font-family="monospace" font-size="13" fill="#333">10.10.0.0/16</text>

  <line x1="400" y1="208" x2="240" y2="298" stroke="#0aa2e0" stroke-width="2.5" marker-end="url(#arr)"/>

  <rect x="55" y="300" width="340" height="120" rx="8" fill="#e3f1fa" stroke="#9cc"/>
  <text x="70" y="324" font-size="14" fill="#0b1530">ewb-a-public · 10.10.1.0/24</text>
  <text x="70" y="344" font-size="12" fill="#333">ewb-bastion · 10.10.1.196 + Elastic IP</text>
  <text x="70" y="362" font-size="11" fill="#555">SG ewb-sg-bastion: SSH 22 from your IP /32</text>
  <text x="70" y="380" font-size="11" fill="#555">RT ewb-rt-a-public: local · 0.0.0.0/0 → igw</text>
  <text x="70" y="396" font-size="11" fill="#555">                       10.20.0.0/16 → pcx</text>

  <line x1="160" y1="420" x2="160" y2="462" stroke="#0aa2e0" stroke-width="2.5" marker-end="url(#arr)"/>
  <text x="168" y="446" font-size="10" fill="#333">SSH (ProxyJump)</text>

  <rect x="55" y="465" width="340" height="125" rx="8" fill="#e3f1fa" stroke="#9cc"/>
  <text x="70" y="489" font-size="14" fill="#0b1530">ewb-a-private · 10.10.2.0/24</text>
  <text x="70" y="509" font-size="12" fill="#333">ewb-app-a · 10.10.2.72 · no public IP</text>
  <text x="70" y="527" font-size="11" fill="#555">SG ewb-sg-app-a: SSH 22 from ewb-sg-bastion</text>
  <text x="70" y="543" font-size="11" fill="#555">                    All ICMP from 10.20.1.75/32</text>
  <text x="70" y="561" font-size="11" fill="#555">RT ewb-rt-a-private: local · 10.20.0.0/16 → pcx</text>

  <!-- VPC B -->
  <rect x="480" y="230" width="390" height="380" rx="12" fill="#f2f7ec" stroke="#9cc07a" stroke-width="2"/>
  <text x="500" y="258" font-size="16" font-weight="bold" fill="#0b1530">ewb-vpc-b</text>
  <text x="500" y="276" font-family="monospace" font-size="13" fill="#333">10.20.0.0/16</text>
  <text x="500" y="296" font-size="11" fill="#555">No internet gateway</text>

  <polyline points="395,340 680,340 680,462" fill="none" stroke="#0aa2e0" stroke-width="2.5" marker-end="url(#arr)"/>
  <text x="560" y="332" font-size="10" fill="#333">SSH via bastion (over peering)</text>

  <rect x="505" y="465" width="340" height="125" rx="8" fill="#e8f2df" stroke="#ac9"/>
  <text x="520" y="489" font-size="14" fill="#0b1530">ewb-b-private · 10.20.1.0/24</text>
  <text x="520" y="509" font-size="12" fill="#333">ewb-app-b · 10.20.1.75 · no public IP</text>
  <text x="520" y="527" font-size="11" fill="#555">SG ewb-sg-app-b: SSH 22 from 10.10.1.0/24</text>
  <text x="520" y="543" font-size="11" fill="#555">                    All ICMP from 10.10.2.72/32</text>
  <text x="520" y="561" font-size="11" fill="#555">RT ewb-rt-b-private: local · 10.10.0.0/16 → pcx</text>

  <!-- Peering -->
  <line x1="395" y1="528" x2="505" y2="528" stroke="#8fd400" stroke-width="4"/>
  <rect x="412" y="512" width="76" height="32" rx="6" fill="#0b1530"/>
  <text x="450" y="526" text-anchor="middle" font-size="10" fill="#fff">PEERING</text>
  <text x="450" y="539" text-anchor="middle" font-size="9" fill="#8fd400">ewb-a-b-peer</text>

  <text x="450" y="630" text-anchor="middle" font-size="11" fill="#555">Conceptual. Peering is non-transitive and does not give VPC B internet access through VPC A.</text>
</svg>
